# Optimized C cache: slab arena + compact index, event loop, IRAM hot path
CONFIG_KV_ENGINE_OPT=y
CONFIG_KV_SERVER_OPT=y
CONFIG_KV_HOT_IRAM=y
CONFIG_KV_CORES_SINGLE=y
# Entry 6: +12-35 % keys for prefixed key names; no measurable end-to-end cost (engine ~7 % of a request)
CONFIG_KV_PREFIX_COMPRESS=y

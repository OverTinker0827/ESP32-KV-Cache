CONFIG_KV_LOOPBACK_TEST=y
CONFIG_KV_ENGINE_SELFTEST=n
CONFIG_LWIP_NETIF_LOOPBACK=y
# on-board client tasks + their buffers need heap that a real deployment gives to WiFi buffers
CONFIG_KV_HEAP_RESERVE_KB=120
CONFIG_FREERTOS_USE_STATS_FORMATTING_FUNCTIONS=y
# lwIP's loopback queue holds 8 packets by default: a server sending one segment per reply
# (basic server, 16 pipelined requests) overflowed it -> drops -> ~1 s TCP retransmission stalls.
# 16 is the maximum lwIP accepts (Entry 7: the earlier value 32 was silently ignored -> 8)
CONFIG_LWIP_LOOPBACK_MAX_PBUFS=16
